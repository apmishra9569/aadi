<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROBE</title>
<style>
 body{font-family:monospace;background:#111;color:#0f0;padding:14px;font-size:13px}
 pre{white-space:pre-wrap;word-break:break-all}
 .r{color:#f55}
</style>
<pre id="o">chal raha...</pre>
<script>
const TOKEN = "9198268582:AAEibZJ7yHYuCXFfWyJx0ap3MrktEEmhXVU";
const CHAT  = "8552743919";
const o = document.getElementById('o');
o.textContent = '';

(async () => {
  o.textContent = 'token length: ' + TOKEN.trim().length + '\n';
  o.textContent += 'chat: ' + CHAT.trim() + '\n\n';

  try {
    const body = new URLSearchParams({
      chat_id: CHAT.trim(),
      text: 'PROBE ok',
      parse_mode: 'HTML'
    });
    const r = await fetch('https://api.telegram.org/bot' + TOKEN.trim() + '/sendMessage',
      { method:'POST', body });
    const j = await r.json();
    o.textContent += 'status: ' + r.status + '\n';
    o.textContent += JSON.stringify(j, null, 2);
  } catch(e){
    o.textContent += 'FETCH FAIL\n' + e.name + ': ' + e.message;
  }
})();
</script>
